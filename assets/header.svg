<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 角丸の背景 -->
  <rect x="10" y="10" width="780" height="180" rx="20" ry="20" fill="url(#gradient)" />
  
  <!-- グラデーション定義 -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4b6cb7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#182848;stop-opacity:1" />
      <animate attributeName="x1" values="0%;100%;0%" dur="10s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;0%;100%" dur="10s" repeatCount="indefinite" />
    </linearGradient>
    
    <!-- メインテキストのアニメーション用フィルター -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- メインテキスト -->
  <text x="400" y="100" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="white" filter="url(#glow)">
    Spatial Vision Gemini
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" />
  </text>
  
  <!-- サブテキスト -->
  <text x="400" y="150" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="rgba(255,255,255,0.9)">
    Advanced Object Detection with Gemini API
    <animate attributeName="y" values="150;145;150" dur="5s" repeatCount="indefinite" />
  </text>
  
  <!-- 装飾的な図形 -->
  <circle cx="200" cy="60" r="15" fill="rgba(255,255,255,0.3)">
    <animate attributeName="r" values="15;20;15" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="600" cy="60" r="15" fill="rgba(255,255,255,0.3)">
    <animate attributeName="r" values="15;20;15" dur="4s" repeatCount="indefinite" />
  </circle>
</svg>
